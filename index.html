<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GB BARAKA Kalkulyator</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#06120a,#102b16);color:#fff}
.wrap{max-width:560px;margin:auto;padding:18px}
.card{background:linear-gradient(160deg,#09130d,#111);border:2px solid #d6a93a;border-radius:24px;padding:20px;box-shadow:0 12px 35px #0008}
h1{margin:0;color:#ffd34d;font-size:34px}
.sub{font-weight:700;margin:6px 0 18px}
label{display:block;margin-top:14px;color:#ffd34d;font-weight:900}
select,input{width:100%;margin-top:7px;padding:15px;border-radius:14px;border:2px solid #d6a93a;font-size:18px;font-weight:800;background:#fff;color:#111}
.result{margin-top:18px;background:#fff;color:#07130b;border-radius:18px;padding:18px;font-size:22px;font-weight:900;line-height:1.55}
.result span{color:#0b7a23}
button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;background:#ffd34d;color:#07130b;font-size:19px;font-weight:900}
.footer{text-align:center;margin-top:18px;color:#ffd34d;font-weight:900;line-height:1.55}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>GB BARAKA</h1>
<div class="sub">Polietilen plyonka kalkulyatori</div>

<label>Plyonka eni</label>
<select id="width" onchange="calc()">
<option value="2">2 metrli plyonka</option>
<option value="1.5">1,5 metrli plyonka</option>
<option value="1.4">1,4 metrli plyonka</option>
</select>

<label>Qalinligi</label>
<select id="micron" onchange="calc()">
<option value="100">100 mikron</option>
<option value="80">80 mikron</option>
<option value="60">60 mikron</option>
<option value="50">50 mikron</option>
<option value="40">40 mikron</option>
<option value="30">30 mikron</option>
<option value="20">20 mikron</option>
<option value="15">15 mikron</option>
<option value="10">10 mikron</option>
</select>

<label>Plyonka og‘irligi, kg</label>
<input id="kg" type="number" min="0.1" step="0.1" value="1" oninput="calc()">

<div class="result" id="result"></div>
<button onclick="sendOrder()">Buyurtma berish</button>
<button onclick="shareResult()">Natijani ko‘rsatish</button>
</div>

<div class="footer">
Buyurtma uchun: @gb_baraka<br>
77 041 77 55 | 90 048 77 55
</div>
</div>

<script>
const table={
"2":{100:2.4,80:3.2,60:4.2,50:5.5,40:6.8,30:8.5,20:12,15:15,10:20},
"1.5":{100:3.5,80:4.3,60:6.2,50:7.3,40:9,30:11,20:16,15:22,10:30},
"1.4":{100:3.8,80:5,60:6.5,50:8,40:10,30:12,20:18,15:24,10:32}
};
let lastText="";
function calc(){
 const w=document.getElementById("width").value;
 const m=document.getElementById("micron").value;
 const kg=parseFloat(document.getElementById("kg").value||"0");
 const perKg=table[w][m];
 const total=perKg*kg;
 lastText=`Plyonka eni: ${w} m\nQalinligi: ${m} mikron\nOg‘irligi: ${kg} kg\n1 kgdan: ${perKg} metr\nJami: ${total.toFixed(1)} metr`;
 document.getElementById("result").innerHTML=`1 kgdan: <span>${perKg}</span> metr<br>${kg} kgdan: <span>${total.toFixed(1)}</span> metr chiqadi`;
}
function shareResult(){
 if(window.Telegram && Telegram.WebApp){Telegram.WebApp.showAlert(lastText)} else {alert(lastText)}
}
function sendOrder(){
 if(window.Telegram && Telegram.WebApp){
   Telegram.WebApp.sendData(lastText);
   Telegram.WebApp.close();
 } else {
   window.open("https://t.me/gb_baraka?text="+encodeURIComponent(lastText),"blank");
 }
}
if(window.Telegram && Telegram.WebApp){Telegram.WebApp.expand()}
calc();
</script>
</body>
</html>
